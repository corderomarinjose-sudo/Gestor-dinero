<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Gestor Financiero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CATEGORIES = {
      INCOME: [
        { id: 'nomina', label: 'Nómina / Sueldo Principal' },
        { id: 'extra', label: 'Paga Extra / Freelance' }
      ],
      EXPENSE: [
        { id: 'hogar_padres', label: 'Hogar / Aportación Familiar' },
        { id: 'deportes', label: 'Deporte y Gimnasio' },
        { id: 'caprichos', label: 'Caprichos y Ocio' },
        { id: 'imprevistos', label: 'Imprevistos' }
      ]
    };

    function App() {
      const [txs, setTxs] = useState(() => JSON.parse(localStorage.getItem('my_txs') || '[]'));
      const [tab, setTab] = useState('home');
      const [houseGoal, setHouseGoal] = useState(() => Number(localStorage.getItem('my_houseGoal')) || 30000);
      const [targetRatio, setTargetRatio] = useState(() => Number(localStorage.getItem('my_ratio')) || 30);

      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [catId, setCatId] = useState('hogar_padres');
      const [desc, setDesc] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
      const [search, setSearch] = useState('');

      useEffect(() => { localStorage.setItem('my_txs', JSON.stringify(txs)); }, [txs]);
      useEffect(() => { localStorage.setItem('my_houseGoal', houseGoal); }, [houseGoal]);
      useEffect(() => { localStorage.setItem('my_ratio', targetRatio); }, [targetRatio]);

      const handleTypeChange = (t) => {
        setType(t);
        setCatId(t === 'income' ? CATEGORIES.INCOME[0].id : CATEGORIES.EXPENSE[0].id);
      };

      const addTx = (e) => {
        e.preventDefault();
        if (!amount || Number(amount) <= 0) return;
        const cat = (type === 'income' ? CATEGORIES.INCOME : CATEGORIES.EXPENSE).find(c => c.id === catId);
        const newTx = {
          id: Date.now().toString(),
          type,
          amount: Number(amount),
          catId,
          catLabel: cat ? cat.label : catId,
          desc: desc.trim() || (cat ? cat.label : ''),
          date
        };
        setTxs([newTx, ...txs]);
        setAmount('');
        setDesc('');
      };

      const delTx = (id) => setTxs(txs.filter(t => t.id !== id));

      const monthTxs = useMemo(() => txs.filter(t => t.date.startsWith(selectedMonth)), [txs, selectedMonth]);
      const filteredTxs = useMemo(() => txs.filter(t => t.desc.toLowerCase().includes(search.toLowerCase()) || t.catLabel.toLowerCase().includes(search.toLowerCase())), [txs, search]);

      const monthlyIncome = useMemo(() => monthTxs.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0), [monthTxs]);
      const monthlyExpenses = useMemo(() => monthTxs.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0), [monthTxs]);
      const monthlySavings = monthlyIncome - monthlyExpenses;
      const savingsPct = monthlyIncome > 0 ? Math.round((monthlySavings / monthlyIncome) * 100) : 0;
      const expensePct = monthlyIncome > 0 ? Math.round((monthlyExpenses / monthlyIncome) * 100) : 0;
      const maxExpenseLimit = monthlyIncome * (targetRatio / 100);
      const monthExtraPot = monthlyIncome > 0 && (maxExpenseLimit - monthlyExpenses) > 0 ? maxExpenseLimit - monthlyExpenses : 0;

      const totalSavings = useMemo(() => {
        const inc = txs.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
        const exp = txs.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
        return Math.max(0, inc - exp);
      }, [txs]);

      const totalExtraPot = useMemo(() => {
        const map = {};
        txs.forEach(t => {
          const m = t.date.slice(0, 7);
          if (!map[m]) map[m] = { inc: 0, exp: 0 };
          if (t.type === 'income') map[m].inc += t.amount;
          if (t.type === 'expense') map[m].exp += t.amount;
        });
        let sum = 0;
        Object.values(map).forEach(m => {
          if (m.inc > 0) {
            const extra = (m.inc * (targetRatio / 100)) - m.exp;
            if (extra > 0) sum += extra;
          }
        });
        return sum;
      }, [txs, targetRatio]);

      const housePct = Math.min(100, Math.round((totalSavings / houseGoal) * 100));

      return (
        <div className="pb-20 max-w-2xl mx-auto px-4 py-4 space-y-5">
          <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
            <div>
              <h1 className="font-extrabold text-lg text-emerald-400">Habitat Control</h1>
              <p className="text-xs text-slate-400">Gestor de Ahorro Vida Adulta</p>
            </div>
            <div className="flex gap-1 text-xs">
              <button onClick={() => setTab('home')} className={`px-3 py-1.5 rounded-xl font-bold ${tab==='home'?'bg-emerald-500 text-slate-950':'text-slate-400'}`}>Inicio</button>
              <button onClick={() => setTab('txs')} className={`px-3 py-1.5 rounded-xl font-bold ${tab==='txs'?'bg-emerald-500 text-slate-950':'text-slate-400'}`}>Lista</button>
              <button onClick={() => setTab('goals')} className={`px-3 py-1.5 rounded-xl font-bold ${tab==='goals'?'bg-emerald-500 text-slate-950':'text-slate-400'}`}>Metas</button>
            </div>
          </div>

          {tab === 'home' && (
            <div className="space-y-4">
              <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800 flex justify-between items-center">
                <span className="text-xs font-bold text-slate-300">Mes a consultar:</span>
                <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="bg-slate-950 text-emerald-400 font-bold text-xs p-2 rounded-xl border border-slate-800 outline-none" />
              </div>

              <div className="bg-gradient-to-br from-slate-900 via-emerald-950/50 to-slate-900 border border-emerald-500/30 p-5 rounded-2xl space-y-3">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] uppercase font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">🏠 Meta Entrada Casa</span>
                    <h2 className="text-2xl font-black text-white mt-2">{totalSavings.toLocaleString('es-ES')} €</h2>
                    <p className="text-xs text-slate-400">Ahorro total acumulado</p>
                  </div>
                  <div className="text-right">
                    <span className="text-[10px] text-slate-400 uppercase font-bold">Objetivo</span>
                    <p className="text-sm font-bold text-white">{houseGoal.toLocaleString('es-ES')} €</p>
                  </div>
                </div>
                <div className="space-y-1">
                  <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                    <div className="bg-emerald-400 h-full transition-all" style={{width: `${housePct}%`}}></div>
                  </div>
                  <div className="flex justify-between text-[11px] font-bold text-emerald-400">
                    <span>{housePct}% completado</span>
                    {monthlySavings > 0 && <span>~{Math.ceil((houseGoal - totalSavings) / monthlySavings)} meses faltantes</span>}
                  </div>
                </div>
              </div>

              <div className="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl flex justify-between items-center">
                <div>
                  <span className="text-[10px] font-bold text-amber-400 uppercase block">☀️ Bote de Verano / Premios</span>
                  <p className="text-lg font-black text-white">+{totalExtraPot.toLocaleString('es-ES')} € Acumulados</p>
                  <p className="text-[11px] text-slate-400">Extra generado por gastar menos del {targetRatio}%</p>
                </div>
                <div className="bg-slate-900 p-2.5 rounded-xl border border-amber-500/30 text-center">
                  <span className="text-[9px] text-amber-400 uppercase block font-bold">Este mes</span>
                  <span className="text-xs font-extrabold text-white">+{monthExtraPot.toLocaleString('es-ES')} €</span>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2 text-xs">
                <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block">Ingresado</span>
                  <span className="text-base font-bold text-emerald-400">{monthlyIncome.toLocaleString('es-ES')} €</span>
                </div>
                <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block">Gastado</span>
                  <span className="text-base font-bold text-rose-400">{monthlyExpenses.toLocaleString('es-ES')} € ({expensePct}%)</span>
                </div>
                <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block">Ahorrado Mes</span>
                  <span className="text-base font-bold text-blue-400">{monthlySavings.toLocaleString('es-ES')} € ({savingsPct}%)</span>
                </div>
                <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block">Límite Gastos ({targetRatio}%)</span>
                  <span className="text-base font-bold text-amber-400">{maxExpenseLimit.toLocaleString('es-ES')} €</span>
                </div>
              </div>

              <form onSubmit={addTx} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 className="font-bold text-sm text-white">➕ Añadir Movimiento</h3>
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={() => handleTypeChange('income')} className={`py-1.5 rounded-xl text-xs font-bold ${type==='income'?'bg-emerald-500 text-slate-950':'bg-slate-800 text-slate-400'}`}>+ Ingreso</button>
                  <button type="button" onClick={() => handleTypeChange('expense')} className={`py-1.5 rounded-xl text-xs font-bold ${type==='expense'?'bg-rose-500 text-white':'bg-slate-800 text-slate-400'}`}>- Gasto</button>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <label className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Importe (€)</label>
                    <input type="number" step="0.01" placeholder="0.00" value={amount} onChange={e => setAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white font-bold outline-none" />
                  </div>
                  <div>
                    <label className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Categoría</label>
                    <select value={catId} onChange={e => setCatId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white outline-none">
                      {(type === 'income' ? CATEGORIES.INCOME : CATEGORIES.EXPENSE).map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                    </select>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <label className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Concepto</label>
                    <input type="text" placeholder="Ej. Gym, Nómina..." value={desc} onChange={e => setDesc(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white outline-none" />
                  </div>
                  <div>
                    <label className="text-[10px] text-slate-400 uppercase font-bold block mb-1">Fecha</label>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white outline-none" />
                  </div>
                </div>
                <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-black text-xs py-2.5 rounded-xl uppercase tracking-wider">Guardar Movimiento</button>
              </form>
            </div>
          )}

          {tab === 'txs' && (
            <div className="space-y-3">
              <input type="text" placeholder="🔍 Buscar movimiento..." value={search} onChange={e => setSearch(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl p-3 text-xs text-white outline-none" />
              <div className="bg-slate-900 rounded-2xl border border-slate-800 divide-y divide-slate-800/60">
                {filteredTxs.length === 0 ? <p className="p-5 text-center text-xs text-slate-500">No hay movimientos guardados</p> : filteredTxs.map(t => (
                  <div key={t.id} className="p-3.5 flex justify-between items-center text-xs">
                    <div>
                      <p className="font-bold text-white">{t.desc}</p>
                      <p className="text-[10px] text-slate-400">{t.catLabel} • {t.date}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className={`font-black ${t.type==='income'?'text-emerald-400':'text-slate-200'}`}>{t.type==='income'?'+':'-'}{t.amount.toLocaleString('es-ES')} €</span>
                      <button onClick={() => delTx(t.id)} className="text-slate-500 hover:text-rose-400 px-1">🗑️</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'goals' && (
            <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4 text-xs">
              <h3 className="font-bold text-white text-sm">🎯 Configuración de Metas</h3>
              <div>
                <label className="block text-slate-300 font-bold mb-1">Meta Entrada Casa (€)</label>
                <input type="number" value={houseGoal} onChange={e => setHouseGoal(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white font-bold outline-none" />
              </div>
              <div>
                <label className="block text-slate-300 font-bold mb-1">Límite Máximo de Gastos ({targetRatio}%)</label>
                <input type="range" min="10" max="60" step="5" value={targetRatio} onChange={e => setTargetRatio(Number(e.target.value))} className="w-full accent-emerald-500" />
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
