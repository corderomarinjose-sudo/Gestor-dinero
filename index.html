<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Gestor Financiero - Vida Adulta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icons
    const Building = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h5m-5 0V11m0 0h5M10 11H5m5 4h5m-5 0H5"></path></svg>;
    const HomeIcon = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>;
    const Compass = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>;
    const ListPlus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h4m-2-2v4"></path></svg>;
    const Target = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0-6C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"></path></svg>;
    const Sparkles = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>;
    const Calendar = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;
    const Sun = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
    const ArrowUpRight = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 17L17 7M17 7H7M17 7V17"></path></svg>;
    const ArrowDownRight = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17L7 7M17 17H7M17 17V7"></path></svg>;
    const TrendingUp = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>;
    const PiggyBank = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
    const Plus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>;
    const Trash2 = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>;
    const Search = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>;
    const Sliders = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>;
    const CheckCircle2 = () => <svg className="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
    const ShieldAlert = () => <svg className="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>;
    const Smartphone = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>;

    const CATEGORIES = {
      INCOME: [
        { id: 'nomina', label: 'Nómina / Sueldo Principal' },
        { id: 'extra', label: 'Paga Extra / Proyecto Freelance' },
        { id: 'inversion', label: 'Rendimientos Ahorro' }
      ],
      EXPENSE: [
        { id: 'hogar_padres', label: 'Hogar / Aportación Familiar' },
        { id: 'deportes', label: 'Salud, Deporte y Gym' },
        { id: 'caprichos', label: 'Ocio, Salidas y Caprichos' },
        { id: 'imprevistos', label: 'Imprevistos y Varios' }
      ]
    };

    function App() {
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('app_transactions');
        return saved ? JSON.parse(saved) : [];
      });

      const [activeTab, setActiveTab] = useState('home');
      const [houseGoal, setHouseGoal] = useState(() => Number(localStorage.getItem('app_houseGoal')) || 30000);
      const [targetExpenseRatio, setTargetExpenseRatio] = useState(() => Number(localStorage.getItem('app_targetRatio')) || 30);

      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [categoryId, setCategoryId] = useState('hogar_padres');
      const [description, setDescription] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);

      const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');

      useEffect(() => {
        localStorage.setItem('app_transactions', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('app_houseGoal', houseGoal);
      }, [houseGoal]);

      useEffect(() => {
        localStorage.setItem('app_targetRatio', targetExpenseRatio);
      }, [targetExpenseRatio]);

      const handleTypeChange = (newType) => {
        setType(newType);
        setCategoryId(newType === 'income' ? CATEGORIES.INCOME[0].id : CATEGORIES.EXPENSE[0].id);
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (!amount || Number(amount) <= 0) return;

        const categoryObj = type === 'income' 
          ? CATEGORIES.INCOME.find(c => c.id === categoryId)
          : CATEGORIES.EXPENSE.find(c => c.id === categoryId);

        const newTx = {
          id: Date.now().toString(),
          type,
          amount: Number(amount),
          categoryId,
          categoryLabel: categoryObj ? categoryObj.label : categoryId,
          description: description.trim() || (categoryObj ? categoryObj.label : ''),
          date
        };

        setTransactions([newTx, ...transactions]);
        setAmount('');
        setDescription('');
      };

      const handleDeleteTransaction = (id) => {
        setTransactions(transactions.filter(t => t.id !== id));
      };

      const filteredTransactionsMonth = useMemo(() => {
        return transactions.filter(t => t.date.startsWith(selectedMonth));
      }, [transactions, selectedMonth]);

      const searchedTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchesSearch = t.description.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                t.categoryLabel.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCategory = filterCategory === 'all' || t.categoryId === filterCategory;
          return matchesSearch && matchesCategory;
        });
      }, [transactions, searchTerm, filterCategory]);

      const monthlyIncome = useMemo(() => {
        return filteredTransactionsMonth
          .filter(t => t.type === 'income')
          .reduce((acc, t) => acc + t.amount, 0);
      }, [filteredTransactionsMonth]);

      const monthlyExpenses = useMemo(() => {
        return filteredTransactionsMonth
          .filter(t => t.type === 'expense')
          .reduce((acc, t) => acc + t.amount, 0);
      }, [filteredTransactionsMonth]);

      const monthlySavings = monthlyIncome - monthlyExpenses;

      const savingsPercentage = useMemo(() => {
        if (monthlyIncome <= 0) return 0;
        return Math.round((monthlySavings / monthlyIncome) * 100);
      }, [monthlyIncome, monthlySavings]);

      const expensePercentage = useMemo(() => {
        if (monthlyIncome <= 0) return 0;
        return Math.round((monthlyExpenses / monthlyIncome) * 100);
      }, [monthlyIncome, monthlyExpenses]);

      const monthlyTargetExpenseLimit = monthlyIncome * (targetExpenseRatio / 100);

      const currentMonthExtraSavings = useMemo(() => {
        if (monthlyIncome <= 0) return 0;
        const surplus = monthlyTargetExpenseLimit - monthlyExpenses;
        return surplus > 0 ? surplus : 0;
      }, [monthlyIncome, monthlyTargetExpenseLimit, monthlyExpenses]);

      const totalAccumulatedSavings = useMemo(() => {
        const totalInc = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
        const totalExp = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
        return Math.max(0, totalInc - totalExp);
      }, [transactions]);

      const totalExtraSavingsAccumulated = useMemo(() => {
        const monthsMap = {};
        transactions.forEach(t => {
          const monthKey = t.date.slice(0, 7);
          if (!monthsMap[monthKey]) {
            monthsMap[monthKey] = { income: 0, expense: 0 };
          }
          if (t.type === 'income') monthsMap[monthKey].income += t.amount;
          if (t.type === 'expense') monthsMap[monthKey].expense += t.amount;
        });

        let extraTotal = 0;
        Object.values(monthsMap).forEach(m => {
          if (m.income > 0) {
            const allowed = m.income * (targetExpenseRatio / 100);
            const monthExtra = allowed - m.expense;
            if (monthExtra > 0) extraTotal += monthExtra;
          }
        });
        return extraTotal;
      }, [transactions, targetExpenseRatio]);

      const houseGoalProgress = Math.min(100, Math.round((totalAccumulatedSavings / houseGoal) * 100));
      const monthsToHouseGoal = useMemo(() => {
        if (monthlySavings <= 0) return null;
        const remaining = houseGoal - totalAccumulatedSavings;
        if (remaining <= 0) return 0;
        return Math.ceil(remaining / monthlySavings);
      }, [houseGoal, totalAccumulatedSavings, monthlySavings]);

      const savingsStatus = useMemo(() => {
        if (monthlyIncome <= 0) return null;
        if (savingsPercentage >= (100 - targetExpenseRatio)) {
          return {
            title: '¡Objetivo de Ahorro Cumplido!',
            message: `Has limitado tus gastos al ${expensePercentage}%. Generas +${currentMonthExtraSavings.toLocaleString('es-ES')} € extras para tu bote de vacaciones.`,
            bg: 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300',
            badgeBg: 'bg-emerald-600 text-white',
            icon: CheckCircle2,
          };
        } else {
          return {
            title: 'Límite de Gastos Excedido',
            message: `Has gastado el ${expensePercentage}% de tus ingresos (Tu objetivo es gastar máximo el ${targetExpenseRatio}%).`,
            bg: 'bg-rose-500/10 border-rose-500/30 text-rose-300',
            badgeBg: 'bg-rose-600 text-white',
            icon: ShieldAlert,
          };
        }
      }, [monthlyIncome, savingsPercentage, expensePercentage, currentMonthExtraSavings, targetExpenseRatio]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 sm:pb-12">
          
          {/* Header Navigation */}
          <header className="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-emerald-500 text-slate-950 rounded-2xl font-black shadow-lg shadow-emerald-500/20">
                  <Building />
                </div>
                <div>
                  <h1 className="font-extrabold text-base tracking-tight leading-none text-white">Habitat Control</h1>
                  <span className="text-[10px] text-emerald-400 font-medium">Gestor de Ahorro</span>
                </div>
              </div>

              <nav className="flex items-center gap-1">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                    activeTab === 'home' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Compass /> Inicio
                </button>
                <button
                  onClick={() => setActiveTab('transactions')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                    activeTab === 'transactions' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <ListPlus /> Movimientos
                </button>
                <button
                  onClick={() => setActiveTab('goals')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                    activeTab === 'goals' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Target /> Objetivos
                </button>
              </nav>
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">

            {/* TAB 1: HOME */}
            {activeTab === 'home' && (
              <div className="space-y-6">
                
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900 p-5 rounded-3xl border border-slate-800">
                  <div>
                    <span className="text-xs text-emerald-400 font-bold uppercase tracking-wider flex items-center gap-1">
                      <Sparkles /> Control Financiero
                    </span>
                    <h2 className="text-2xl font-black text-white mt-0.5">Resumen del Mes</h2>
                  </div>
                  
                  <div className="flex items-center gap-2 bg-slate-950 px-4 py-2 rounded-2xl border border-slate-800">
                    <Calendar />
                    <input 
                      type="month" 
                      value={selectedMonth}
                      onChange={(e) => setSelectedMonth(e.target.value)}
                      className="bg-transparent text-white font-bold text-xs outline-none cursor-pointer"
                    />
                  </div>
                </div>

                {/* META DE CASA */}
                <div className="bg-gradient-to-br from-slate-900 via-emerald-950/40 to-slate-900 rounded-3xl p-6 border border-emerald-500/20 shadow-xl">
                  <div className="flex justify-between items-start gap-4 mb-4">
                    <div>
                      <div className="inline-flex items-center gap-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold mb-2">
                        <HomeIcon /> Entrada de Vivienda / Futuro
                      </div>
                      <h3 className="text-3xl font-black text-white">{totalAccumulatedSavings.toLocaleString('es-ES')} €</h3>
                      <p className="text-xs text-slate-400 mt-1">Acumulado total de tus ahorros</p>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-slate-400 block font-medium">Objetivo</span>
                      <span className="text-lg font-bold text-white">{houseGoal.toLocaleString('es-ES')} €</span>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <div className="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700">
                      <div 
                        className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500"
                        style={{ width: `${houseGoalProgress}%` }}
                      />
                    </div>
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-emerald-400 font-bold">{houseGoalProgress}% completado</span>
                      {monthsToHouseGoal !== null && (
                        <span className="text-slate-400 font-medium">
                          ~{monthsToHouseGoal} meses para alcanzar la meta
                        </span>
                      )}
                    </div>
                  </div>
                </div>

                {/* BOTE DE VERANO */}
                <div className="bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-amber-500/10 rounded-3xl p-6 border border-amber-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div className="space-y-1">
                    <div className="flex items-center gap-2 text-amber-400 font-bold text-xs">
                      <Sun /> BOTE LIBRE PARA VERANO Y CAPRICHOS
                    </div>
                    <h4 className="text-xl font-black text-white">
                      +{totalExtraSavingsAccumulated.toLocaleString('es-ES')} € Acumulados
                    </h4>
